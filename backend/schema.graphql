# GraphQL Schema Reference

enum TaskStatus {
  PENDING
  IN_PROGRESS
  COMPLETED
}

enum TaskPriority {
  LOW
  MEDIUM
  HIGH
  CRITICAL
}

enum SubtaskStatus {
  PENDING
  COMPLETED
}

enum MetaType {
  TEXT
  LINK
  COLOR
  DATE
  FILE
  IMAGE
}

type Jabatan {
  kode: Int!
  nama: String!
}

type Divisi {
  kode: Int!
  nama: String!
}

type Pegawai {
  kode: Int!
  nama: String!
  kodejabatan: Int!
  kodedivisi: Int!
  statusLeader: Int
  jabatan: Jabatan
  divisi: Divisi
}

type User {
  kodeku: String!
  username: String!
  avatarUrl: String
  pegawai: Pegawai
}

type Colleague {
  kodeku: String!
  nama: String!
  statusLeader: Int
  avatarUrl: String
  jabatan: Jabatan
}

type AuthPayload {
  token: String!
  user: User!
}

type Task {
  id: ID!
  title: String!
  description: String
  status: TaskStatus!
  priority: TaskPriority!
  userKode: String!
  createdBy: String!
  startDate: String
  dueDate: String
  completedAt: String
  sortOrder: Int
  createdAt: String!
  updatedAt: String!
  comments: [TaskComment!]!
  meta: [TaskMeta!]!
  subtasks: [Subtask!]!
}

type TaskConnection {
  tasks: [Task!]!
  nextCursor: String
  hasMore: Boolean!
}

type Subtask {
  id: ID!
  taskId: ID!
  description: String!
  status: SubtaskStatus!
  sortOrder: Int!
  createdAt: String!
  updatedAt: String!
}

type CommentAttachment {
  id: ID!
  url: String!
  fileName: String!
  fileType: String
  sizeBytes: Int
}

type ReactionSummary {
  emoji: String!
  count: Int!
  reacted: Boolean!
}

type TaskComment {
  id: ID!
  content: String!
  userKode: String!
  createdAt: String!
  parentId: ID
  replies: [TaskComment!]!
  reactions: [ReactionSummary!]!
  attachments: [CommentAttachment!]!
}

type TaskMeta {
  id: ID!
  key: String!
  value: String
  type: MetaType!
  sortOrder: Int
}

input TaskMetaInput {
  key: String!
  value: String
  type: MetaType!
}

input CreateTaskInput {
  title: String!
  description: String
  status: TaskStatus
  priority: TaskPriority
  targetUserKode: String
  projectId: ID
  startDate: String
  dueDate: String
  meta: [TaskMetaInput!]
  subtasks: [String!]
}

input UpdateTaskInput {
  title: String
  description: String
  status: TaskStatus
  priority: TaskPriority
  startDate: String
  dueDate: String
  meta: [TaskMetaInput!]
  targetUserKode: String
}

input CreateSubtaskInput {
  taskId: ID!
  description: String!
  status: SubtaskStatus
}

input UpdateSubtaskInput {
  description: String
  status: SubtaskStatus
}

input CommentAttachmentInput {
  url: String!
  fileName: String!
  fileType: String
  sizeBytes: Int
}

type Query {
  me: User
  colleagues: [Colleague!]!
  colleaguesByDivisi(divisiKode: Int!): [Colleague!]!
  tasks(
    limit: Int
    cursor: String
    userKode: String
    search: String
    startDate: String
    dueDate: String
    projectId: ID
  ): TaskConnection!
  task(id: ID!): Task
}

type Mutation {
  login(username: String!, password: String!): AuthPayload!
  createTask(input: CreateTaskInput!): Task!
  updateTask(id: ID!, input: UpdateTaskInput!): Task!
  deleteTask(id: ID!): Boolean!
  reorderTasks(orderedIds: [ID!]): [Task!]
  addTaskComment(
    taskId: ID!
    content: String!
    parentId: ID
    attachments: [CommentAttachmentInput!]
  ): TaskComment!
  toggleReaction(commentId: ID!, emoji: String!): TaskComment!
  deleteComment(id: ID!): Boolean!
  setTaskMeta(taskId: ID!, key: String!, value: String, type: MetaType): TaskMeta!
  deleteTaskMeta(id: ID!): Boolean!
  reorderTaskMeta(taskId: ID!, orderedIds: [ID!]): Boolean!
  createSubtask(input: CreateSubtaskInput!): Subtask!
  updateSubtask(id: ID!, input: UpdateSubtaskInput!): Subtask!
  deleteSubtask(id: ID!): Boolean!
  reorderSubtasks(taskId: ID!, orderedIds: [ID!]!): Boolean!
}
